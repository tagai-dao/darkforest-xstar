procs:
  client:
    cwd: packages/client
    shell: pnpm run dev
  contracts:
    cwd: packages/contracts
    shell: pnpm mud dev-contracts --rpc http://127.0.0.1:8545
  anvil:
    cwd: packages/contracts
    shell: bash script/start-local-anvil.sh
  explorer:
    cwd: packages/contracts
    shell: pnpm explorer
  api:
    cwd: packages/api
    shell: pnpm run dev
  # 排行榜投影：本地需先有 indexer HTTP + MySQL；生产用 packages/indexer/start-project.sh
